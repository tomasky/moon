name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish release assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Release linux x86_64
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      LINUX_TARGET: x86_64-unknown-linux-gnu
      LINUX_GLIBC_VERSION: "2.23"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          targets: ${{ env.LINUX_TARGET }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.22.1 cargo-zigbuild

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo zigbuild --release --target "${LINUX_TARGET}.${LINUX_GLIBC_VERSION}"

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${LINUX_TARGET}/release/moon" dist/moon
          cp "target/${LINUX_TARGET}/release/moonrun" dist/moonrun
          tar -C dist -czf "moon-${RELEASE_TAG}-linux-x86_64.tar.gz" moon moonrun

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="moon-${RELEASE_TAG}-linux-x86_64.tar.gz"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              "${asset}"
          fi
